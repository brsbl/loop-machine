<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loop Machine</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="sidebar">
      <div class="json-editor-title">JSON State</div>
      <pre><code id="json-editor" contenteditable="true" spellcheck="false"></code></pre>
      <button id="apply-json-button">Apply Changes</button>
    </div>

    <div class="main-container">
      <div class="device-frame">
        <div class="loop-machine">
          <!-- Pattern Bar Indicators -->
          <div class="pattern-indicators">
            <div class="pattern-bar pattern-1"></div>
            <div class="pattern-bar pattern-2"></div>
            <div class="pattern-bar pattern-3"></div>
            <div class="pattern-bar pattern-4"></div>
            <div class="pattern-bar pattern-5"></div>
            <div class="pattern-bar pattern-6"></div>
            <div class="pattern-bar pattern-7"></div>
            <div class="pattern-bar pattern-8"></div>
            <div class="pattern-bar pattern-9"></div>
            <div class="pattern-bar pattern-10"></div>
            <div class="pattern-bar pattern-11"></div>
            <div class="pattern-bar pattern-12"></div>
            <div class="pattern-bar pattern-13"></div>
            <div class="pattern-bar pattern-14"></div>
            <div class="pattern-bar pattern-15"></div>
            <div class="pattern-bar pattern-16"></div>
          </div>

          <div class="controls-section">
            <!-- Left Controls -->
            <div class="left-controls">
              <!-- Transport Controls -->
              <div class="transport-controls">
                <button id="play-button" class="transport-btn play-btn"></button>
                <button id="stop-button" class="transport-btn stop-btn"></button>
                <button id="record-button" class="transport-btn record-btn"></button>
              </div>
              <!-- Secondary Controls -->
              <div class="secondary-controls">
                <button id="loop-button" class="control-btn">↻</button>
                <button id="reverse-button" class="control-btn">✕</button>
                <button id="settings-button" class="control-btn">⚙</button>
              </div>
              <!-- Action Buttons -->
              <div class="action-buttons">
                <button id="save-button" class="action-btn save-btn">SAVE</button>
                <button id="delete-button" class="action-btn delete-btn">DELETE</button>
              </div>
            </div>

            <!-- Main Sequencer Area -->
            <div class="sequencer-container">
              <!-- Drum Sequencer -->
              <div class="drum-sequencer">
                <div class="measure-markers">
                  <div class="measure-number">1</div>
                  <div class="measure-number">2</div>
                  <div class="measure-number">3</div>
                  <div class="measure-number">4</div>
                </div>
                <div class="drum-tracks">
                  <!-- Drum tracks will be generated by JavaScript -->
                </div>
              </div>

              <!-- Divider -->
              <div class="section-divider"></div>

              <!-- Chord Progression Section -->
              <div class="chord-section">
                <div class="chord-controls">
                  <button class="chord-btn chord-g">G</button>
                  <button class="chord-btn chord-d">D</button>
                  <button class="chord-btn chord-c">C</button>
                </div>
                <div class="chord-sequencer">
                  <!-- Chord progression grid will be generated by JavaScript -->
                </div>
              </div>
            </div>

            <!-- Effects Section -->
            <div class="effects-section">
              <div class="effects-column">
                <div class="effect-header">REVERB</div>
                <div class="track-effects">
                  <div class="effect-slider-container">
                    <input type="range" class="effect-slider reverb-slider" data-track="0" min="0" max="100" value="0">
                    <div class="slider-track"></div>
                  </div>
                  <div class="effect-slider-container">
                    <input type="range" class="effect-slider reverb-slider" data-track="1" min="0" max="100" value="0">
                    <div class="slider-track"></div>
                  </div>
                  <div class="effect-slider-container">
                    <input type="range" class="effect-slider reverb-slider" data-track="2" min="0" max="100" value="0">
                    <div class="slider-track"></div>
                  </div>
                  <div class="effect-slider-container">
                    <input type="range" class="effect-slider reverb-slider" data-track="3" min="0" max="100" value="0">
                    <div class="slider-track"></div>
                  </div>
                  <div class="effect-slider-container">
                    <input type="range" class="effect-slider reverb-slider" data-track="4" min="0" max="100" value="0">
                    <div class="slider-track"></div>
                  </div>
                  <div class="effect-slider-container">
                    <input type="range" class="effect-slider reverb-slider" data-track="5" min="0" max="100" value="0">
                    <div class="slider-track"></div>
                  </div>
                </div>
              </div>
              <div class="effects-column">
                <div class="effect-header">DELAY</div>
                <div class="track-effects">
                  <div class="effect-slider-container">
                    <input type="range" class="effect-slider delay-slider" data-track="0" min="0" max="100" value="0">
                    <div class="slider-track"></div>
                  </div>
                  <div class="effect-slider-container">
                    <input type="range" class="effect-slider delay-slider" data-track="1" min="0" max="100" value="0">
                    <div class="slider-track"></div>
                  </div>
                  <div class="effect-slider-container">
                    <input type="range" class="effect-slider delay-slider" data-track="2" min="0" max="100" value="0">
                    <div class="slider-track"></div>
                  </div>
                  <div class="effect-slider-container">
                    <input type="range" class="effect-slider delay-slider" data-track="3" min="0" max="100" value="0">
                    <div class="slider-track"></div>
                  </div>
                  <div class="effect-slider-container">
                    <input type="range" class="effect-slider delay-slider" data-track="4" min="0" max="100" value="0">
                    <div class="slider-track"></div>
                  </div>
                  <div class="effect-slider-container">
                    <input type="range" class="effect-slider delay-slider" data-track="5" min="0" max="100" value="0">
                    <div class="slider-track"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="../src/script.js"></script>
  </body>
</html>
